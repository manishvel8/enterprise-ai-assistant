---
# backend/deployment.yaml — FastAPI backend Deployment.
#
# Notable configurations:
#   envFrom: mount all ConfigMap keys as env vars (no hardcoding)
#   env (valueFrom secretKeyRef): mount individual secrets as env vars
#   Multiple env vars from both ConfigMap and Secret in same container
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ai-assistant
  labels:
    app: backend
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: enterprise-ai-assistant/backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          # Mount all ConfigMap keys as environment variables
          envFrom:
            - configMapRef:
                name: ai-assistant-config

          # Mount individual secrets as environment variables
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-secrets
                  key: OPENAI_API_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-secrets
                  key: POSTGRES_PASSWORD
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-secrets
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-secrets
                  key: NEO4J_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-secrets
                  key: MINIO_SECRET_KEY
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-secrets
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-secrets
                  key: LANGFUSE_SECRET_KEY
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
