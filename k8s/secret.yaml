---
# secret.yaml — Sensitive configuration (API keys, passwords).
#
# IMPORTANT: Never commit real secrets to git.
# This file uses placeholder values.
#
# Production workflow:
#   1. Base64-encode your values:
#      echo -n "your-api-key" | base64
#   2. Replace the placeholder values below
#   3. Apply to cluster:
#      kubectl apply -f k8s/secret.yaml -n ai-assistant
#
# Better alternatives for production:
#   - HashiCorp Vault (secret rotation, audit logs)
#   - AWS Secrets Manager / GCP Secret Manager
#   - Kubernetes External Secrets Operator (syncs from cloud secret managers)
#
# Why base64 and not encryption?
#   Kubernetes Secrets are base64-encoded, NOT encrypted by default.
#   Enable etcd encryption at rest for real security:
#   https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/
#
# Apply: kubectl apply -f k8s/secret.yaml -n ai-assistant
apiVersion: v1
kind: Secret
metadata:
  name: ai-assistant-secrets
  namespace: ai-assistant
  labels:
    app.kubernetes.io/name: enterprise-ai-assistant
type: Opaque
data:
  # echo -n "your-actual-value" | base64
  OPENAI_API_KEY: "c2steW91ci1vcGVuYWkta2V5LWhlcmU="         # sk-your-openai-key-here
  POSTGRES_USER: "YWlfYXNzaXN0YW50"                            # ai_assistant
  POSTGRES_PASSWORD: "Y2hhbmdlbWUx"                            # changeme1
  NEO4J_USER: "bmVvNGo="                                        # neo4j
  NEO4J_PASSWORD: "Y2hhbmdlbWUx"                               # changeme1
  MINIO_ACCESS_KEY: "bWluaW9hZG1pbg=="                         # minioadmin
  MINIO_SECRET_KEY: "Y2hhbmdlbWUx"                             # changeme1
  LANGFUSE_PUBLIC_KEY: "cGstbGYteW91ci1rZXk="                 # pk-lf-your-key
  LANGFUSE_SECRET_KEY: "c2stbGYteW91ci1rZXk="                 # sk-lf-your-key
  SECRET_KEY: "eW91ci1mYXN0YXBpLXNlY3JldC1rZXk="             # your-fastapi-secret-key
