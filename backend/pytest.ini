[pytest]
# pytest.ini — Pytest configuration for the backend test suite.
#
# WHY THIS FILE?
#   pytest looks for this file (or pyproject.toml [tool.pytest.ini_options])
#   to understand test discovery paths, markers, and async mode.

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode: "auto" means all async test functions run automatically
# without needing @pytest.mark.asyncio decorator on every function
asyncio_mode = auto

# Custom markers (used with -m flag to run subsets)
# Example: pytest -m "not slow" → skip slow tests in CI
markers =
    slow: marks tests as slow (>5s)
    integration: marks integration tests (require running services)
    unit: marks unit tests (no external dependencies)
    rag: marks RAG quality tests
    security: marks security tests

# Output settings
addopts =
    --tb=short
    --strict-markers
    -q

# Minimum pytest version
minversion = 7.0
