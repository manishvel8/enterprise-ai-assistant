---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-assistant-config
  namespace: {{ include "ai-assistant.namespace" . }}
  labels:
    {{ include "ai-assistant.labels" . | nindent 4 }}
data:
  OPENAI_CHAT_MODEL: {{ .Values.config.openaiChatModel | quote }}
  OPENAI_EMBEDDING_MODEL: {{ .Values.config.openaiEmbeddingModel | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ENABLE_DEBUG_PANEL: {{ .Values.config.enableDebugPanel | quote }}
  BACKEND_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}

  # Service discovery via DNS (container name = service name in K8s)
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "ai_assistant"
  POSTGRES_USER: "ai_user"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  CELERY_BROKER_URL: "redis://redis-service:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/1"
  QDRANT_HOST: "qdrant-service"
  QDRANT_PORT: "6333"
  NEO4J_URI: "bolt://neo4j-service:7687"
  NEO4J_USER: "neo4j"
  MINIO_ENDPOINT: "minio-service:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_USE_SSL: "false"
