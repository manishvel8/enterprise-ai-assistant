---
# Secret — stores sensitive values encoded in base64.
#
# IMPORTANT: In production, do NOT store real secrets in values.yaml.
# Use one of:
#   Option A: helm install ... --set secrets.openaiApiKey=sk-real-key
#   Option B: Sealed Secrets (kubeseal encrypts secrets for git storage)
#   Option C: External Secrets Operator (pulls from AWS Secrets Manager / Vault)
#
# The base64 encoding here is NOT encryption — it's just encoding.
# Anyone with kubectl get secret can decode it.
# Real security comes from RBAC (only authorized pods can read the Secret).
apiVersion: v1
kind: Secret
metadata:
  name: ai-assistant-secrets
  namespace: {{ include "ai-assistant.namespace" . }}
  labels:
    {{ include "ai-assistant.labels" . | nindent 4 }}
type: Opaque
stringData:
  # stringData allows plain text — Kubernetes encodes to base64 automatically.
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.secrets.langfusePublicKey | default "" | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.secrets.langfuseSecretKey | default "" | quote }}
  TAVILY_API_KEY: {{ .Values.secrets.tavilyApiKey | default "" | quote }}
