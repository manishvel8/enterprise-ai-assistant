# nginx.conf — Nginx configuration for the Angular SPA
#
# Two responsibilities:
# 1. Serve the Angular SPA with proper SPA routing (history API fallback)
# 2. Proxy /api/* requests to the FastAPI backend
#
# SPA routing problem:
#   Angular uses the HTML5 History API for routing (/chat, /documents).
#   When a user refreshes /documents, Nginx looks for a file called "documents"
#   — which doesn't exist. Without the try_files fallback, they get a 404.
#   The fix: always return index.html, and let Angular's router handle the URL.
#
# API proxy:
#   In production, the frontend and backend share a domain.
#   Instead of allowing CORS calls to a different backend URL,
#   Nginx proxies /api/* to the backend container.
#   This means: app.company.com/api/chat → backend:8000/api/chat
#   Angular code always calls /api/* (relative URL in production).

server {
    listen 80;
    server_name _;                  # Accept any hostname

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Serve Angular static files
    root /usr/share/nginx/html;
    index index.html;

    # ─── SPA routing ───────────────────────────────────────────────────────
    # For any URL that doesn't match a real file, serve index.html.
    # Angular's router will then handle the URL client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── API proxy ─────────────────────────────────────────────────────────
    # In Docker Compose and Kubernetes, 'backend' is the service hostname.
    # Production: replace 'backend:8000' with the actual backend service URL.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for SSE (Server-Sent Events) streaming responses
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;    # 5 minutes — long for streaming chat
    }

    # ─── Health endpoint (for Kubernetes readiness probe) ──────────────────
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ─── Static asset caching ──────────────────────────────────────────────
    # Angular generates hashed filenames (main.abc123.js) — safe to cache forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html should never be cached — it's where Angular loads from
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
}
