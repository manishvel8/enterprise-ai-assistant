# =============================================================================
# docker-compose.yml — Full local development stack
# =============================================================================
#
# Starts ALL services with one command: docker compose up --build
#
# Services:
#   frontend   → http://localhost:4200 (Angular via Nginx)
#   backend    → http://localhost:8000 (FastAPI)
#   worker     → (background, processes document queue)
#   redis      → localhost:6379 (task queue + cache)
#   postgres   → localhost:5432 (metadata DB)
#   neo4j      → http://localhost:7474 (graph browser UI)
#   qdrant     → http://localhost:6333/dashboard (vector DB UI)
#   minio      → http://localhost:9001 (object storage UI)
#   langfuse   → http://localhost:3000 (LLM observability UI)
#
# Key concepts:
#   - networks: all services share the 'ai-network' bridge network
#     → services can reach each other by container name (e.g., 'postgres')
#   - volumes: named volumes persist data between container restarts
#     → 'postgres-data' survives `docker compose down`; wiped by `docker compose down -v`
#   - depends_on: controls startup order and health conditions
#   - environment: env vars injected from .env file (never hardcoded here)
#   - healthcheck: Docker monitors service health; depends_on waits for 'healthy' state
# =============================================================================

version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes — data that survives container restarts
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
  qdrant-data:
    driver: local
  minio-data:
    driver: local
  redis-data:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
# Shared network — all services communicate by container name
# ─────────────────────────────────────────────────────────────────────────────
networks:
  ai-network:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# Services
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  # Purpose: Stores document metadata, chunks, sessions, user records.
  # Why postgres:16-alpine? Alpine Linux base = smaller image, faster startup.
  postgres:
    image: postgres:16-alpine
    container_name: ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_user} -d ${POSTGRES_DB:-ai_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Redis ──────────────────────────────────────────────────────────────────
  # Purpose: Celery task broker (document processing queue) + embedding cache.
  # Why redis:7-alpine? Minimal image for a memory-optimized data store.
  redis:
    image: redis:7-alpine
    container_name: ai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes    # persist data to disk
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Neo4j ──────────────────────────────────────────────────────────────────
  # Purpose: Knowledge graph — entities, relationships, topics.
  # Browser UI: http://localhost:7474 (login: neo4j / your-password)
  # Bolt protocol: bolt://localhost:7687 (for application connections)
  neo4j:
    image: neo4j:5.26-community
    container_name: ai-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-dev_password}
      # Memory settings for development (reduce for limited RAM)
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
      # Accept terms of service for development
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    ports:
      - "7474:7474"    # HTTP (browser UI)
      - "7687:7687"    # Bolt (application connection)
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Qdrant ─────────────────────────────────────────────────────────────────
  # Purpose: Vector database for document chunk embeddings.
  # Dashboard: http://localhost:6333/dashboard
  # REST API: http://localhost:6333
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ai-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"    # REST API + dashboard
      - "6334:6334"    # gRPC (optional, for high-performance clients)
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO ──────────────────────────────────────────────────────────────────
  # Purpose: S3-compatible object storage for original uploaded files.
  # Console UI: http://localhost:9001 (login: minioadmin / minioadmin)
  # API: http://localhost:9000
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: ai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # MinIO Console UI
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ─────────────────────────────────────────────────────────
  # Purpose: REST API + agentic workflow orchestration.
  # API Docs: http://localhost:8000/docs
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-backend:dev
    container_name: ai-backend
    restart: unless-stopped
    environment:
      # All values come from .env file — none hardcoded here
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}

      POSTGRES_HOST: postgres        # container name (not localhost!)
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ai_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}

      REDIS_HOST: redis              # container name
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      QDRANT_HOST: qdrant            # container name
      QDRANT_PORT: 6333

      NEO4J_URI: bolt://neo4j:7687  # container name
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-dev_password}

      MINIO_ENDPOINT: minio:9000    # container name
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-ai-documents}
      MINIO_USE_SSL: "false"

      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}

      BACKEND_DEBUG: "true"
      BACKEND_CORS_ORIGINS: "http://localhost:4200,http://localhost:80"
      LOG_LEVEL: INFO
      ENABLE_DEBUG_PANEL: "true"
    ports:
      - "8000:8000"
    networks:
      - ai-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Development: mount source code for hot reload
    # Comment out in production builds (image already contains the code)
    volumes:
      - ./backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "info"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Celery Worker ───────────────────────────────────────────────────────────
  # Purpose: Processes document ingestion tasks asynchronously.
  # No HTTP port — it connects OUT to Redis and databases.
  worker:
    build:
      context: .                     # build context is project root
      dockerfile: worker/Dockerfile
    image: ai-worker:dev
    container_name: ai-worker
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ai_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      REDIS_HOST: redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-dev_password}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-ai-documents}
      MINIO_USE_SSL: "false"
      LOG_LEVEL: INFO
    networks:
      - ai-network
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app    # hot reload for worker code too

  # ─── Angular Frontend ─────────────────────────────────────────────────────────
  # Purpose: Angular SPA served by Nginx.
  # UI: http://localhost:4200
  # In dev, Nginx proxies /api/* → backend container.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ai-frontend:dev
    container_name: ai-frontend
    restart: unless-stopped
    ports:
      - "4200:80"              # map host 4200 → container 80 (Nginx)
    networks:
      - ai-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
